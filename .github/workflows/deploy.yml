name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-gamma:
    name: Deploy gamma
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g aws-cdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python3 -m venv .venv && .venv/bin/pip install -e ".[infra]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy gamma
        run: >
          cdk deploy "DepthChartGamma/**" --require-approval never
          --context openai_api_key=${{ secrets.OPENAI_API_KEY }}
          --context depth_chart_api_key=${{ secrets.DEPTH_CHART_API_KEY }}
        working-directory: cdk

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g aws-cdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python3 -m venv .venv && .venv/bin/pip install -e ".[infra]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy prod
        run: >
          cdk deploy "DepthChartProd/**" --require-approval never
          --context openai_api_key=${{ secrets.OPENAI_API_KEY }}
          --context depth_chart_api_key=${{ secrets.DEPTH_CHART_API_KEY }}
        working-directory: cdk
