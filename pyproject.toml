[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depth-chart-agent"
version = "0.1.0"
description = "AI-powered MLB depth chart generator"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.17.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/depth_chart_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
